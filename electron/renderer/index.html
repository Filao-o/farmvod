<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmVod</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">

        <!-- ═══ View 0 : Accueil ═══ -->
        <div id="view-home" class="view active">
            <div class="toolbar">
                <button id="btn-new-projet" class="btn btn-dark">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Nouveau Projet
                </button>
                <div class="toolbar-right">
                    <button id="btn-sort" class="btn btn-outline" title="Trier">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M4 8h8M6 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                    <div class="search-wrap">
                        <svg class="search-icon" width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        <input type="text" id="search-input" placeholder="Rechercher...">
                    </div>
                </div>
            </div>
            <div id="projet-grid" class="grid"></div>
        </div>

        <!-- ═══ View 1 : Projet ═══ -->
        <div id="view-project" class="view">
            <div class="topbar">
                <button class="btn-icon btn-back" data-target="home" title="Retour">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2 id="projet-title"></h2>
                <div class="topbar-actions">
                    <button id="btn-test" class="btn btn-outline">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polygon points="2,1 12,7 2,13" fill="currentColor"/></svg>
                        Test 30s
                    </button>
                    <button id="btn-run" class="btn btn-dark">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="2" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M5 5l3 2-3 2z" fill="currentColor"/></svg>
                        Compiler
                    </button>
                    <button id="btn-metadata" class="btn-icon" title="Métadonnées & Export">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 2h8l4 4v12a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 2v4h4M7 10h6M7 13h6M7 16h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                    </button>
                    <button id="btn-settings" class="btn-icon" title="Configuration">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8.5 1h3l.4 2.4a6.5 6.5 0 011.8 1l2.3-.8 1.5 2.6-1.9 1.6a6.5 6.5 0 010 2.1l1.9 1.6-1.5 2.6-2.3-.8a6.5 6.5 0 01-1.8 1L11.5 19h-3l-.4-2.4a6.5 6.5 0 01-1.8-1l-2.3.8-1.5-2.6 1.9-1.6a6.5 6.5 0 010-2.1L2.5 8.5 4 5.9l2.3.8a6.5 6.5 0 011.8-1L8.5 1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
                    </button>
                </div>
            </div>

            <div class="project-body">
                <!-- Top row: config + background -->
                <div class="project-top">
                    <div class="card config-card">
                        <label>Durée cible (min) <input type="number" id="cfg-duree" min="1" max="360" value="180"></label>
                        <label>Crossfade (sec) <input type="number" id="cfg-crossfade" min="0" max="10" step="0.5" value="3"></label>
                    </div>
                    <div id="bg-zone" class="bg-zone">
                        <img id="bg-img" alt="" class="hidden">
                        <button id="btn-choose-bg" class="btn btn-outline bg-btn">Choisir une image</button>
                    </div>
                </div>

                <!-- Mid row: upload + citations -->
                <div class="project-mid">
                    <button id="btn-upload-audio" class="btn btn-outline">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v9M3 5l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 10v2a1 1 0 001 1h10a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        Upload une musique
                    </button>
                    <div class="citations-row">
                        <label class="toggle-wrap" title="Activer/désactiver les citations">
                            <input type="checkbox" id="citations-toggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                        <select id="citations-select">
                            <option value="">Aucune</option>
                        </select>
                        <button id="btn-add-citation" class="btn-icon btn-small" title="Ajouter un fichier de citations">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Track list -->
                <div class="card track-card">
                    <ul id="audio-list"></ul>
                    <div id="audio-empty" class="empty-msg">Aucune piste — glisse des fichiers audio ici</div>
                </div>
            </div>
        </div>

        <!-- ═══ View 2 : Config / Preview ═══ -->
        <div id="view-config" class="view">
            <div class="topbar">
                <button class="btn-icon btn-back" data-target="project" title="Retour">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2>Configuration</h2>
                <div class="topbar-actions">
                    <button id="btn-goto-console" class="btn btn-outline">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 2h12v10H1z" stroke="currentColor" stroke-width="1.3"/><path d="M3 5l2 2-2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 9h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                        Console
                    </button>
                </div>
            </div>

            <div class="config-body">
                <div id="preview-frame">
                    <img id="preview-bg" alt="">
                    <div id="preview-citation">"The secret of getting ahead is getting started."</div>
                    <div id="preview-auteur">Mark Twain</div>
                    <div id="preview-bar-bg"><div id="preview-bar-fill"></div></div>
                    <div id="preview-time-left">12:34</div>
                    <div id="preview-time-right">1:47:26</div>
                </div>

                <div class="config-controls">
                    <div class="card config-panel">
                        <h3>Typographie</h3>
                        <label>Taille Citation <input type="number" id="cfg-taille-citation" min="10" max="80" value="30"></label>
                        <label>Taille Auteur <input type="number" id="cfg-taille-auteur" min="10" max="60" value="22"></label>
                        <label>Taille Temps <input type="number" id="cfg-taille-temps" min="8" max="40" value="16"></label>
                        <label>Épaisseur barre <input type="number" id="cfg-epaisseur-barre" min="2" max="20" value="8"></label>
                    </div>
                    <div class="card config-panel">
                        <h3>Espacement</h3>
                        <label>Espace Citation/Auteur <input type="number" id="cfg-espace-cite-auteur" min="0" max="100" value="40"></label>
                        <label>Espace Auteur/Barre <input type="number" id="cfg-espace-auteur-barre" min="0" max="200" value="87"></label>
                        <label>Marge Bas (%) <input type="number" id="cfg-marge-bas" min="1" max="40" value="12"></label>
                        <label>Marge Latérale (%) <input type="number" id="cfg-marge-lat" min="1" max="30" value="8"></label>
                    </div>
                    <div class="card config-panel">
                        <h3>Polices & Couleurs</h3>
                        <label>Citation / Auteur
                            <button id="btn-font-cite" class="btn btn-outline btn-font" title="Choisir la police">SF UI Display</button>
                        </label>
                        <label>Temps
                            <button id="btn-font-temps" class="btn btn-outline btn-font" title="Choisir la police">SF UI Display</button>
                        </label>
                        <label>Couleur Texte <input type="color" id="cfg-couleur-texte" value="#000000"></label>
                        <label>Couleur Barre <input type="color" id="cfg-couleur-barre" value="#000000"></label>
                        <label>FPS <input type="number" id="cfg-fps" min="24" max="60" value="30"></label>
                        <label>Intervalle citation (min) <input type="number" id="cfg-citation-intervalle" min="1" max="30" value="5"></label>
                        <label>Fade citation (sec) <input type="number" id="cfg-citation-fade" min="0" max="5" step="0.5" value="1"></label>
                    </div>
                </div>

                <button id="btn-save-config" class="btn btn-dark save-btn">Sauvegarder</button>
            </div>
        </div>

        <!-- ═══ View 4 : Métadonnées ═══ -->
        <div id="view-metadata" class="view">
            <div class="topbar">
                <button class="btn-icon btn-back" data-target="project" title="Retour">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2>Métadonnées & Export</h2>
                <div class="topbar-actions">
                    <button id="btn-open-output" class="btn btn-outline">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2h4l1 1h5v9H2V2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                        Ouvrir le dossier
                    </button>
                </div>
            </div>
            <div class="metadata-body">
                <div class="metadata-grid">
                    <!-- Video player -->
                    <div class="meta-video-wrap">
                        <video id="meta-video" controls></video>
                        <div id="meta-video-empty" class="empty-msg">Aucune vidéo compilée</div>
                    </div>
                    <!-- Metadata fields -->
                    <div class="meta-fields">
                        <div class="card meta-card">
                            <label class="meta-label">
                                <span>Titre YouTube</span>
                                <input type="text" id="meta-titre" placeholder="Titre de la vidéo">
                            </label>
                            <label class="meta-label">
                                <span>Tags</span>
                                <input type="text" id="meta-tags" placeholder="lofi, study, focus (séparés par des virgules)">
                            </label>
                            <label class="meta-label meta-label-full">
                                <span>Description</span>
                                <textarea id="meta-description" rows="10" placeholder="Description YouTube..."></textarea>
                            </label>
                            <div class="meta-actions">
                                <button id="btn-copy-desc" class="btn btn-outline">
                                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="4" y="4" width="9" height="9" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M10 4V2a1 1 0 00-1-1H2a1 1 0 00-1 1v7a1 1 0 001 1h2" stroke="currentColor" stroke-width="1.3"/></svg>
                                    Copier la description
                                </button>
                                <button id="btn-save-meta" class="btn btn-dark">Sauvegarder</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ═══ View 3 : Console ═══ -->
        <div id="view-console" class="view">
            <div class="topbar">
                <button class="btn-icon btn-back" data-target="project" title="Retour">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2>Console</h2>
                <div class="topbar-actions">
                    <button id="btn-clear-console" class="btn btn-outline btn-small">Effacer</button>
                </div>
            </div>
            <pre id="console-output"></pre>
        </div>

    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <h3 id="modal-title"></h3>
            <input type="text" id="modal-input" placeholder="">
            <div class="modal-actions">
                <button id="modal-cancel" class="btn btn-outline">Annuler</button>
                <button id="modal-confirm" class="btn btn-dark">Créer</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>
</html>
